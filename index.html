<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tasko - 모바일 투두</title>
    <meta name="description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:title" content="Tasko - 모바일 투두" />
    <meta property="og:description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pretendard Font -->
    <!-- 첫 화면이 그려지기 전에 저장된 모드(없으면 기기 설정)를 적용해 깜빡임을 막는다 -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('tasko-theme');
        } catch (e) {
          theme = null;
        }
        var isDark = theme === 'dark';
        if (theme !== 'dark' && theme !== 'light') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#1A1E29] min-h-screen text-[#212529] dark:text-[#F1F3F5] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
